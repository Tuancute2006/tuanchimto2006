<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>TikTok Account Manager | Đăng nhập • Đăng ký • Đổi nền</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        /* NỀN CHÍNH */
        body {
            background: #ffffff;
            min-height: 100vh;
            padding: 2rem 1.5rem;
            transition: background 0.3s ease;
        }
        body.dark {
            background: #121212;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        /* FORM ĐĂNG NHẬP / ĐĂNG KÝ */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .auth-card {
            background: white;
            border-radius: 40px;
            width: 100%;
            max-width: 450px;
            padding: 2rem;
            box-shadow: 0 25px 45px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        body.dark .auth-card {
            background: #1e1e2e;
            color: #eee;
            box-shadow: 0 25px 45px rgba(0,0,0,0.4);
        }
        .auth-card h2 {
            text-align: center;
            font-size: 1.9rem;
            margin-bottom: 0.5rem;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin: 1.2rem 0 1.5rem;
            border-bottom: 2px solid #e2e8f0;
        }
        body.dark .auth-tabs {
            border-bottom-color: #334155;
        }
        .auth-tab {
            flex: 1;
            background: none;
            border: none;
            padding: 0.7rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #6c6f78;
        }
        .auth-tab.active {
            color: #7c3aed;
            border-bottom: 3px solid #7c3aed;
            margin-bottom: -2px;
        }
        body.dark .auth-tab.active {
            color: #c084fc;
            border-bottom-color: #c084fc;
        }
        .input-group {
            margin-bottom: 1rem;
        }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border-radius: 60px;
            border: 1.5px solid #e2e8f0;
            background: #f8fafc;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }
        body.dark .input-group input {
            background: #2d2d3a;
            border-color: #4a5568;
            color: white;
        }
        .input-group input:focus {
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124,58,237,0.2);
        }
        .pass-wrapper {
            position: relative;
        }
        .toggle-pass {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            color: #6b7280;
        }
        .auth-btn {
            width: 100%;
            background: #1e1b2e;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            margin-top: 0.5rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .auth-btn:hover {
            background: #2d2a44;
            transform: scale(0.98);
        }
        body.dark .auth-btn {
            background: #3b2e5e;
        }
        .error-msg {
            color: #e11d48;
            font-size: 0.75rem;
            margin-top: 5px;
        }

        /* MAIN APP (sau khi đăng nhập) */
        .main-app {
            display: none;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 1.8rem;
        }
        .user-info {
            background: #f1f5f9;
            padding: 6px 18px;
            border-radius: 60px;
            font-weight: 500;
        }
        body.dark .user-info {
            background: #2d2d3a;
            color: #ddd;
        }
        .btn-icon {
            background: #e2e8f0;
            border: none;
            padding: 6px 16px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
            transition: 0.2s;
        }
        .btn-icon.logout {
            background: #fee2e2;
            color: #b91c1c;
        }
        body.dark .btn-icon.logout {
            background: #7f1a1a;
            color: #fecaca;
        }
        .theme-switch {
            display: flex;
            gap: 10px;
        }
        .theme-btn {
            background: #cbd5e1;
            border: none;
            padding: 6px 18px;
            border-radius: 60px;
            cursor: pointer;
            font-weight: 500;
        }
        .theme-btn.light {
            background: #f8fafc;
            color: #0f172a;
            border: 1px solid #94a3b8;
        }
        .theme-btn.dark {
            background: #1e293b;
            color: white;
        }
        .card {
            background: white;
            border-radius: 28px;
            padding: 1.5rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        body.dark .card {
            background: #1e1e2e;
            color: #e2e8f0;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: flex-end;
        }
        .field {
            flex: 1;
            min-width: 160px;
        }
        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 4px;
        }
        .field input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 40px;
            border: 1.5px solid #e2e8f0;
            background: white;
        }
        body.dark .field input {
            background: #2d2d3a;
            border-color: #4a5568;
            color: white;
        }
        .btn-primary {
            background: #0f172a;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-danger {
            background: #dc2626;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
        }
        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            gap: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        th, td {
            text-align: left;
            padding: 12px 8px;
            border-bottom: 1px solid #e2e8f0;
        }
        body.dark th, body.dark td {
            border-bottom-color: #334155;
        }
        .action-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .small-btn {
            background: #f1f5f9;
            border: none;
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }
        .small-btn.edit { background: #eef2ff; color: #2563eb; }
        .small-btn.delete { background: #fee2e2; color: #dc2626; }
        .small-copy {
            background: #eef2ff;
            border: none;
            padding: 4px 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            cursor: pointer;
        }
        .footer-note {
            text-align: center;
            margin-top: 2rem;
            font-size: 0.7rem;
            opacity: 0.7;
        }
        /* modal xác nhận xóa */
        .modal-confirm {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5000;
            visibility: hidden;
            opacity: 0;
            transition: 0.2s;
        }
        .modal-confirm.show {
            visibility: visible;
            opacity: 1;
        }
        .modal-box {
            background: white;
            border-radius: 32px;
            padding: 1.8rem;
            max-width: 350px;
            text-align: center;
        }
        body.dark .modal-box {
            background: #2d2d3a;
            color: white;
        }
        .modal-box button {
            margin: 10px;
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Phần đăng nhập / đăng ký -->
        <div id="authSection">
            <div class="auth-wrapper">
                <div class="auth-card">
                    <h2>🔐 TikTok Vault</h2>
                    <div class="auth-tabs">
                        <button class="auth-tab active" id="tabLogin">Đăng nhập</button>
                        <button class="auth-tab" id="tabRegister">Đăng ký</button>
                    </div>

                    <!-- Form Đăng nhập -->
                    <div id="loginForm">
                        <div class="input-group">
                            <input type="text" id="loginUser" placeholder="Tên đăng nhập">
                        </div>
                        <div class="input-group pass-wrapper">
                            <input type="password" id="loginPass" placeholder="Mật khẩu">
                            <button type="button" class="toggle-pass" data-target="loginPass">👁️</button>
                        </div>
                        <div id="loginError" class="error-msg"></div>
                        <button id="doLogin" class="auth-btn">Đăng nhập ➔</button>
                    </div>

                    <!-- Form Đăng ký -->
                    <div id="registerForm" style="display: none;">
                        <div class="input-group">
                            <input type="text" id="regUser" placeholder="Tên đăng nhập mới">
                        </div>
                        <div class="input-group pass-wrapper">
                            <input type="password" id="regPass" placeholder="Mật khẩu">
                            <button type="button" class="toggle-pass" data-target="regPass">👁️</button>
                        </div>
                        <div class="input-group pass-wrapper">
                            <input type="password" id="regConfirm" placeholder="Xác nhận mật khẩu">
                            <button type="button" class="toggle-pass" data-target="regConfirm">👁️</button>
                        </div>
                        <div id="regError" class="error-msg"></div>
                        <button id="doRegister" class="auth-btn">Tạo tài khoản ✨</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Phần quản lý tài khoản TikTok (chỉ hiện sau đăng nhập) -->
        <div id="mainApp" class="main-app">
            <div class="top-bar">
                <div class="user-info" id="welcomeUser"></div>
                <div style="display: flex; gap: 12px;">
                    <div class="theme-switch">
                        <button class="theme-btn light" id="lightModeBtn">🌞 Trắng</button>
                        <button class="theme-btn dark" id="darkModeBtn">🌙 Đen</button>
                    </div>
                    <button id="logoutBtn" class="btn-icon logout">🚪 Đăng xuất</button>
                </div>
            </div>

            <div class="card">
                <div class="form-row">
                    <div class="field">
                        <label>📧 Email / TikTok ID</label>
                        <input type="text" id="accUser" placeholder="@user or email">
                    </div>
                    <div class="field">
                        <label>🔒 Mật khẩu</label>
                        <input type="text" id="accPass" placeholder="Mật khẩu">
                    </div>
                    <div class="field">
                        <label>📝 Ghi chú</label>
                        <input type="text" id="accNote" placeholder="tuỳ chọn">
                    </div>
                    <div>
                        <button id="addAccountBtn" class="btn-primary">➕ Thêm</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="toolbar">
                    <span id="counter" style="font-weight:600;">📋 0 tài khoản</span>
                    <button id="clearAllBtn" class="btn-danger">🗑️ Xóa tất cả</button>
                </div>
                <div style="overflow-x: auto;">
                    <table id="accountsTable">
                        <thead>
                            <tr><th>STT</th><th>Tài khoản</th><th>Mật khẩu</th><th>Ghi chú</th><th>Thao tác</th></tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
            <div class="footer-note">✅ Dữ liệu được lưu riêng theo tài khoản đăng nhập • Ghi nhớ nền • Ghi nhớ đăng nhập</div>
        </div>
    </div>

    <!-- Modal xác nhận xóa -->
    <div id="confirmModal" class="modal-confirm">
        <div class="modal-box">
            <h3>⚠️ Xác nhận</h3>
            <p id="confirmMsg">Bạn có chắc chắn muốn xóa?</p>
            <div>
                <button id="confirmYes" style="background:#dc2626; color:white;">Xóa</button>
                <button id="confirmNo" style="background:#e2e8f0;">Hủy</button>
            </div>
        </div>
    </div>

    <script>
        // ---------- LƯU TRỮ USER & DATA ----------
        let currentUser = null;
        let accounts = [];          // danh sách tài khoản TikTok của user hiện tại
        let passVisible = {};       // lưu trạng thái hiện mật khẩu theo id

        // Helper toast (đơn giản)
        function showToast(msg, isErr = false) {
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '20px';
            toast.style.right = '20px';
            toast.style.backgroundColor = isErr ? '#dc2626' : '#1f2937';
            toast.style.color = 'white';
            toast.style.padding = '10px 20px';
            toast.style.borderRadius = '40px';
            toast.style.zIndex = '9999';
            toast.style.fontSize = '0.85rem';
            toast.style.fontWeight = '500';
            toast.style.boxShadow = '0 5px 15px rgba(0,0,0,0.2)';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }

        // Lưu users (đăng ký)
        function getUsers() {
            let data = localStorage.getItem('app_users');
            return data ? JSON.parse(data) : {};
        }
        function saveUsers(users) {
            localStorage.setItem('app_users', JSON.stringify(users));
        }
        // Lưu data TikTok của từng user
        function getUserData(username) {
            let all = localStorage.getItem('user_tiktok_data');
            let storage = all ? JSON.parse(all) : {};
            return storage[username] || [];
        }
        function saveUserData(username, data) {
            let all = localStorage.getItem('user_tiktok_data');
            let storage = all ? JSON.parse(all) : {};
            storage[username] = data;
            localStorage.setItem('user_tiktok_data', JSON.stringify(storage));
        }

        // Đăng ký
        function register(user, pass) {
            if (!user.trim() || !pass.trim()) return "Vui lòng nhập đầy đủ";
            if (pass.length < 4) return "Mật khẩu phải từ 4 ký tự";
            const users = getUsers();
            if (users[user]) return "Tên đăng nhập đã tồn tại";
            users[user] = { password: pass };
            saveUsers(users);
            // tạo data rỗng
            saveUserData(user, []);
            return "success";
        }

        // Đăng nhập
        function login(user, pass) {
            const users = getUsers();
            if (!users[user]) return "Sai tên đăng nhập";
            if (users[user].password !== pass) return "Sai mật khẩu";
            currentUser = user;
            accounts = getUserData(user);
            localStorage.setItem('loggedInUser', user);
            return "success";
        }

        // Đăng xuất
        function logout() {
            currentUser = null;
            accounts = [];
            passVisible = {};
            localStorage.removeItem('loggedInUser');
            document.getElementById('mainApp').style.display = 'none';
            document.getElementById('authSection').style.display = 'block';
            showToast("Đã đăng xuất");
        }

        // Lưu accounts hiện tại
        function persistAccounts() {
            if (currentUser) saveUserData(currentUser, accounts);
        }

        // Render bảng tài khoản TikTok
        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const counterSpan = document.getElementById('counter');
            if (!accounts.length) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center;">✨ Chưa có tài khoản, thêm mới ✨</td></tr>`;
                counterSpan.innerText = `📋 0 tài khoản`;
                return;
            }
            let html = '';
            accounts.forEach((acc, idx) => {
                const visible = passVisible[acc.id] === true;
                const passShow = visible ? acc.password : '••••••••';
                html += `
                    <tr>
                        <td>${idx+1}</td>
                        <td><div style="display:flex; gap:6px; align-items:center;">${escapeHtml(acc.username)}<button class="small-copy" data-copy-user="${acc.id}">📋</button></div></td>
                        <td><div style="display:flex; gap:6px; align-items:center;">${escapeHtml(passShow)}<button class="small-copy" data-toggle-pass="${acc.id}">${visible ? '🙈' : '👁️'}</button><button class="small-copy" data-copy-pass="${acc.id}">📋 mk</button></div></td>
                        <td>${acc.note ? escapeHtml(acc.note) : '—'}</td>
                        <td><div class="action-group"><button class="small-btn edit" data-edit="${acc.id}">✏️ Sửa</button><button class="small-btn delete" data-del="${acc.id}">🗑️ Xóa</button></div></td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
            counterSpan.innerText = `📋 ${accounts.length} tài khoản`;

            // Gắn sự kiện
            document.querySelectorAll('[data-edit]').forEach(btn => {
                btn.addEventListener('click', () => handleEdit(btn.getAttribute('data-edit')));
            });
            document.querySelectorAll('[data-del]').forEach(btn => {
                btn.addEventListener('click', () => confirmDelete(btn.getAttribute('data-del')));
            });
            document.querySelectorAll('[data-toggle-pass]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.getAttribute('data-toggle-pass');
                    passVisible[id] = !passVisible[id];
                    renderTable();
                });
            });
            document.querySelectorAll('[data-copy-user]').forEach(btn => {
                btn.addEventListener('click', () => copyField(btn.getAttribute('data-copy-user'), 'user'));
            });
            document.querySelectorAll('[data-copy-pass]').forEach(btn => {
                btn.addEventListener('click', () => copyField(btn.getAttribute('data-copy-pass'), 'pass'));
            });
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'})[m]); }

        function handleEdit(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;
            let newUser = prompt("Sửa tài khoản:", acc.username);
            if (newUser === null) return;
            let newPass = prompt("Sửa mật khẩu:", acc.password);
            if (newPass === null) return;
            let newNote = prompt("Sửa ghi chú:", acc.note || "");
            if (newNote === null) return;
            if (!newUser.trim() || !newPass.trim()) { showToast("Không được để trống!", true); return; }
            // kiểm tra trùng
            if (accounts.some(a => a.id !== id && a.username.toLowerCase() === newUser.trim().toLowerCase())) {
                showToast("Tên tài khoản đã tồn tại", true);
                return;
            }
            acc.username = newUser.trim();
            acc.password = newPass.trim();
            acc.note = newNote.trim();
            persistAccounts();
            renderTable();
            showToast("Đã cập nhật");
        }

        function confirmDelete(id) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmMsg').innerText = `Xóa tài khoản "${acc.username}"?`;
            modal.classList.add('show');
            const yesHandler = () => {
                accounts = accounts.filter(a => a.id !== id);
                delete passVisible[id];
                persistAccounts();
                renderTable();
                showToast(`Đã xóa ${acc.username}`);
                modal.classList.remove('show');
                cleanup();
            };
            const noHandler = () => {
                modal.classList.remove('show');
                cleanup();
            };
            function cleanup() {
                document.getElementById('confirmYes').removeEventListener('click', yesHandler);
                document.getElementById('confirmNo').removeEventListener('click', noHandler);
            }
            document.getElementById('confirmYes').addEventListener('click', yesHandler);
            document.getElementById('confirmNo').addEventListener('click', noHandler);
        }

        async function copyField(id, type) {
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;
            const text = type === 'user' ? acc.username : acc.password;
            try {
                await navigator.clipboard.writeText(text);
                showToast(`📋 Đã copy ${type === 'user' ? 'tài khoản' : 'mật khẩu'}`);
            } catch(e) { showToast("Lỗi copy", true); }
        }

        function addAccount(username, password, note) {
            if (!username.trim() || !password.trim()) { showToast("Vui lòng nhập đầy đủ", true); return false; }
            if (accounts.some(a => a.username.toLowerCase() === username.trim().toLowerCase())) {
                showToast("Tài khoản đã tồn tại", true);
                return false;
            }
            const newId = Date.now() + '-' + Math.random().toString(36).substr(2, 6);
            accounts.push({
                id: newId,
                username: username.trim(),
                password: password.trim(),
                note: note?.trim() || "",
                createdAt: Date.now()
            });
            persistAccounts();
            renderTable();
            showToast(`✅ Đã thêm ${username.trim()}`);
            return true;
        }

        function clearAll() {
            if (!accounts.length) { showToast("Danh sách trống"); return; }
            const modal = document.getElementById('confirmModal');
            document.getElementById('confirmMsg').innerText = `Xóa TOÀN BỘ ${accounts.length} tài khoản? Không thể hoàn tác.`;
            modal.classList.add('show');
            const yesHandler = () => {
                accounts = [];
                passVisible = {};
                persistAccounts();
                renderTable();
                showToast("Đã xóa toàn bộ");
                modal.classList.remove('show');
                cleanup();
            };
            const noHandler = () => {
                modal.classList.remove('show');
                cleanup();
            };
            function cleanup() {
                document.getElementById('confirmYes').removeEventListener('click', yesHandler);
                document.getElementById('confirmNo').removeEventListener('click', noHandler);
            }
            document.getElementById('confirmYes').addEventListener('click', yesHandler);
            document.getElementById('confirmNo').addEventListener('click', noHandler);
        }

        // Kiểm tra tự động đăng nhập
        function checkAutoLogin() {
            const saved = localStorage.getItem('loggedInUser');
            if (saved && getUsers()[saved]) {
                currentUser = saved;
                accounts = getUserData(saved);
                return true;
            }
            return false;
        }

        // -------- XỬ LÝ GIAO DIỆN ----------
        const authSection = document.getElementById('authSection');
        const mainAppDiv = document.getElementById('mainApp');
        const loginFormDiv = document.getElementById('loginForm');
        const registerFormDiv = document.getElementById('registerForm');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');

        tabLogin.addEventListener('click', () => {
            loginFormDiv.style.display = 'block';
            registerFormDiv.style.display = 'none';
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
        });
        tabRegister.addEventListener('click', () => {
            loginFormDiv.style.display = 'none';
            registerFormDiv.style.display = 'block';
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
        });

        // Đăng nhập action
        document.getElementById('doLogin').addEventListener('click', () => {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value.trim();
            const res = login(user, pass);
            if (res === "success") {
                renderTable();
                document.getElementById('welcomeUser').innerHTML = `👋 Xin chào, ${currentUser}`;
                authSection.style.display = 'none';
                mainAppDiv.style.display = 'block';
                showToast(`Đăng nhập thành công, ${user}`);
            } else {
                document.getElementById('loginError').innerText = res;
            }
        });

        // Đăng ký
        document.getElementById('doRegister').addEventListener('click', () => {
            const user = document.getElementById('regUser').value.trim();
            const pass = document.getElementById('regPass').value.trim();
            const confirm = document.getElementById('regConfirm').value.trim();
            if (pass !== confirm) {
                document.getElementById('regError').innerText = "Mật khẩu xác nhận không khớp";
                return;
            }
            const res = register(user, pass);
            if (res === "success") {
                showToast("✅ Đăng ký thành công! Hãy đăng nhập.");
                // chuyển sang tab đăng nhập
                tabLogin.click();
                document.getElementById('regUser').value = '';
                document.getElementById('regPass').value = '';
                document.getElementById('regConfirm').value = '';
                document.getElementById('regError').innerText = '';
            } else {
                document.getElementById('regError').innerText = res;
                showToast(res, true);
            }
        });

        // Thêm tài khoản TikTok
        document.getElementById('addAccountBtn').addEventListener('click', () => {
            const user = document.getElementById('accUser').value;
            const pass = document.getElementById('accPass').value;
            const note = document.getElementById('accNote').value;
            if (addAccount(user, pass, note)) {
                document.getElementById('accUser').value = '';
                document.getElementById('accPass').value = '';
                document.getElementById('accNote').value = '';
            }
        });
        document.getElementById('clearAllBtn').addEventListener('click', clearAll);
        document.getElementById('logoutBtn').addEventListener('click', logout);

        // Chế độ nền trắng/đen
        const lightBtn = document.getElementById('lightModeBtn');
        const darkBtn = document.getElementById('darkModeBtn');
        function setTheme(theme) {
            if (theme === 'dark') {
                document.body.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            }
        }
        lightBtn.addEventListener('click', () => setTheme('light'));
        darkBtn.addEventListener('click', () => setTheme('dark'));
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') setTheme('dark');
        else setTheme('light');

        // toggle password trong auth
        document.querySelectorAll('.toggle-pass').forEach(btn => {
            btn.addEventListener('click', function() {
                const targetId = this.getAttribute('data-target');
                const input = document.getElementById(targetId);
                if (input) {
                    const type = input.type === 'password' ? 'text' : 'password';
                    input.type = type;
                    this.textContent = type === 'password' ? '👁️' : '🙈';
                }
            });
        });

        // Khởi chạy
        if (checkAutoLogin()) {
            renderTable();
            document.getElementById('welcomeUser').innerHTML = `👋 Xin chào, ${currentUser}`;
            authSection.style.display = 'none';
            mainAppDiv.style.display = 'block';
        } else {
            authSection.style.display = 'block';
            mainAppDiv.style.display = 'none';
            // reset form login
            document.getElementById('loginUser').value = '';
            document.getElementById('loginPass').value = '';
            document.getElementById('loginError').innerText = '';
            document.getElementById('regError').innerText = '';
        }
    </script>
</body>
</html>
